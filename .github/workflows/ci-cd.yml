name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Sanity Test
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout@v4.1.7 SHA
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # Pinned actions/setup-python@v5.1.0 SHA
      - name: Set up Python 3.10
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t secure-api-platform:${{ github.sha }} .

  secret-scan:
    name: Secret Leak Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout@v4.1.7 SHA
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      # Pinned gitleaks/gitleaks-action@v2.3.7 SHA
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@bd2db5390ed34e2c88d8b671a533ff5390f0c08d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scanning (Semgrep)
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout@v4.1.7 SHA
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error .
